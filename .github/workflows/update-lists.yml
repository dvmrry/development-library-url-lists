name: Discover package repositories

on:
  schedule:
    - cron: "17 3 * * 2"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: url-list-discovery
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Discover candidates and render outputs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/update.py --network

      - name: Test the proposed update
        run: |
          python -m unittest discover -s tests -v
          python scripts/validate.py

      - name: Open or update discovery pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPDATE_BRANCH: automation/update-url-list-candidates
        shell: bash
        run: |
          if git diff --quiet -- data/candidates.json dist; then
            echo "No new evidence was discovered."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$UPDATE_BRANCH"
          git add -- data/candidates.json dist
          git commit -m "chore: refresh URL discovery candidates"
          git push --force origin "HEAD:$UPDATE_BRANCH"

          if ! gh pr list --state open --head "$UPDATE_BRANCH" --json number --jq '.[0].number' | grep -q '[0-9]'; then
            gh pr create \
              --base main \
              --head "$UPDATE_BRANCH" \
              --title "chore: refresh URL discovery candidates" \
              --body "Automated discovery from public package-manager configurations and Package-URL definitions. Candidates require human review before promotion."
          fi
