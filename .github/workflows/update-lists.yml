name: Discover package repositories

on:
  schedule:
    - cron: "17 3 * * 2"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: url-list-discovery
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Restore evidence from an open automation branch
        env:
          UPDATE_BRANCH: automation/update-url-list-candidates
        shell: bash
        run: |
          if git ls-remote --exit-code --heads origin "refs/heads/$UPDATE_BRANCH" >/dev/null; then
            git fetch --no-tags origin "$UPDATE_BRANCH"
            git restore --source=FETCH_HEAD -- data/candidates.json
          fi

      - name: Discover candidates and render outputs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/update.py --network

      - name: Export candidates for private vendor review
        run: python scripts/export_review_queue.py

      - name: Optional OpenAI coverage review
        if: vars.LLM_REVIEW_PROVIDER == 'openai'
        env:
          LLM_REVIEW_MODEL: ${{ vars.LLM_REVIEW_MODEL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python scripts/llm_review.py --provider openai --optional

      - name: Optional Anthropic coverage review
        if: vars.LLM_REVIEW_PROVIDER == 'anthropic'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LLM_REVIEW_MODEL: ${{ vars.LLM_REVIEW_MODEL }}
        run: python scripts/llm_review.py --provider anthropic --optional

      - name: Optional Gemini coverage review
        if: vars.LLM_REVIEW_PROVIDER == 'gemini'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LLM_REVIEW_MODEL: ${{ vars.LLM_REVIEW_MODEL }}
        run: python scripts/llm_review.py --provider gemini --optional

      - name: Optional DeepSeek coverage review
        if: vars.LLM_REVIEW_PROVIDER == 'deepseek'
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          LLM_REVIEW_MODEL: ${{ vars.LLM_REVIEW_MODEL }}
        run: python scripts/llm_review.py --provider deepseek --optional

      - name: Test the proposed update
        run: |
          python -m unittest discover -s tests -v
          python scripts/validate.py

      - name: Open or update discovery pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPDATE_BRANCH: automation/update-url-list-candidates
        shell: bash
        run: |
          if ! git status --porcelain -- data/candidates.json dist reviews/llm reviews/pending | grep -q .; then
            echo "No new evidence was discovered."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$UPDATE_BRANCH"
          git add -- data/candidates.json dist
          git add -- reviews/pending
          if [ -d reviews/llm ]; then
            git add -- reviews/llm
          fi
          git commit -m "chore: refresh URL discovery candidates"
          git push --force origin "HEAD:$UPDATE_BRANCH"

          if ! gh pr list --state open --head "$UPDATE_BRANCH" --json number --jq '.[0].number' | grep -q '[0-9]'; then
            gh pr create \
              --base main \
              --head "$UPDATE_BRANCH" \
              --title "chore: refresh URL discovery candidates" \
              --body "Automated discovery from public package-manager configurations, Package-URL definitions, and published registry/mirror catalogs. Candidates require human review before promotion. reviews/pending contains the public handoff queue for a private Cloudflare/Zscaler pass. If configured, reviews/llm/latest.md contains suggestion-only LLM gap analysis; its links remain unverified until a person checks them."
          fi
